version: 2
updates:
  # .github/workflows/ 配下の全 workflow が対象。SHA pin と横の # vN コメントを更新する。
  # flake.lock と registry/sources.lock.json は just update で手動更新する
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
